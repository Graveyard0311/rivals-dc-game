name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run check:server
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: rivals-collision-web
          path: dist/
          retention-days: 14
